key: gpt-image-2-image-to-image
label: GPT Image 2 Image to Image
family: market
provider_model: gpt-image-2-image-to-image
task_modes:
  - image_edit
inputs:
  image:
    required_min: 1
    required_max: 16
  video:
    required_min: 0
    required_max: 0
  audio:
    required_min: 0
    required_max: 0
options:
  aspect_ratio:
    type: enum
    allowed: [auto, '1:1', '9:16', '16:9', '4:3', '3:4']
    default: auto
  resolution:
    type: enum
    allowed: ['1K', '2K', '4K']
    default: null
prompt:
  required: true
  max_chars: 20000
  enhancement_supported: true
  enhancement_default_policy: ask
  default_profile_keys_by_input_pattern:
    image_edit: gpt_image_2_image_to_image_v1
defaults: {}
transport:
  endpoint_family: market
  create_path: /api/v1/jobs/createTask
  status_path: /api/v1/jobs/recordInfo
  callback_supported: true
  image_input_field: input_urls
verification:
  verified_from:
    - docs_kie_openapi_markdown
    - docs_kie_request_example
    - live_smoke_submit_status_download
  verified_on: '2026-04-25'
  verification_notes:
    - Verified from https://docs.kie.ai/market/gpt/gpt-image-2-image-to-image.md and the rendered docs request example.
    - The OpenAPI schema requires model and input, and the input object requires prompt and input_urls.
    - The provider model enum is exactly gpt-image-2-image-to-image.
    - The input_urls array accepts up to 16 image URLs.
    - The documented image input field is input_urls, not the image_input field used by Nano Banana image-edit models.
    - The documented aspect_ratio values are auto, 1:1, 9:16, 16:9, 4:3, and 3:4.
    - The documented resolution values are 1K, 2K, and 4K.
    - The docs state that 1:1 images cannot be converted to 4K.
    - The docs state that auto or omitted aspect_ratio only supports 1K resolution, otherwise task creation fails.
    - The source page does not document image file formats or maximum file size for input_urls, so no image_constraints are asserted here.
    - Live smoke task 8ccd5d163ca958b4d281cd0850167fa5 succeeded on 2026-04-25 with one uploaded input URL, aspect_ratio 4:3, and resolution 1K.
    - The live smoke confirmed createTask submission, recordInfo status polling, output download, and local artifact creation.
