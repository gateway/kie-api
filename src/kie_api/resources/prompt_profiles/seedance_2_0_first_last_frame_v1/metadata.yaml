key: seedance_2_0_first_last_frame_v1
label: Seedance 2.0 First+Last Frame Prompt Enhancer v1
version: v1
applies_to_models:
  - seedance-2.0
  - seedance-2.0-fast
  - seedance-2.0-mini
applies_to_task_modes:
  - reference_to_video
applies_to_input_patterns:
  - first_last_frames
variables:
  - user_prompt
  - first_frame_present
  - last_frame_present
rules:
  - Preserve continuity between the supplied first and last frame images.
  - Describe motion that bridges the two endpoint frames cleanly.
  - Avoid introducing visual changes that would contradict the ending frame.
notes:
  - Use this preset when Seedance 2.0 Standard, Fast, or Mini has one first frame image and one last frame image.
