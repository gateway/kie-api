  verification_notes:
  - 'Contract source: https://docs.kie.ai/market/gpt/gpt-image-2-5-flare-text-to-image.md.'
  - Required root fields are model and input; callBackUrl is optional. Prompt is required,
    with a documented maximum of 20000 characters.
  - Aspect ratios follow the actual OpenAPI enum, not x-apidog-enum display metadata.
  - The playground advertises 1K-only limits for 27:16, 16:27, 9:8 and 8:9, but the
    API docs omit them. Per onboarding decision, follow the API schema and do not
    enforce this playground-only restriction.
  - 'Do not inherit GPT Image 2 square/auto high-resolution restrictions: they are
    absent from the 2.5 API contract.'
  - Resolution 1K is a local wrapper default for deterministic payloads and pricing;
    lowercase aliases are local normalization.
  - Live smoke c825deb440cc60a67f254431c5f3bc06 succeeded on 2026-09-09 with aspect_ratio
    1:1 and resolution 1K; returned a 1254x1254 PNG. Download, artifact originals,
    web/thumb derivatives and visual output were verified.
  - Live proof covers one 1K square request only; all other documented combinations
    remain docs-backed.
