key: seedance-2.0
label: Seedance 2.0 Standard
family: market
provider_model: bytedance/seedance-2
task_modes:
  - text_to_video
  - reference_to_video
inputs:
  image:
    required_min: 0
    required_max: 9
  video:
    required_min: 0
    required_max: 3
  audio:
    required_min: 0
    required_max: 3
input_constraints:
  image_formats: [jpg, jpeg, png, webp, bmp, gif]
  image_max_mb: 30
  video_duration_max_seconds: 15
options:
  return_last_frame:
    type: bool
    default: false
  generate_audio:
    type: bool
    default: false
  resolution:
    type: enum
    allowed: [480p, 720p]
    default: 720p
  aspect_ratio:
    type: enum
    allowed: ['16:9', '4:3', '1:1', '3:4', '9:16', '21:9']
    default: '16:9'
  duration:
    type: int_range
    min: 4
    max: 15
    required: true
  web_search:
    type: bool
    default: false
prompt:
  required: true
  max_chars: null
  enhancement_supported: true
  enhancement_default_policy: ask
  default_profile_key: seedance_2_0_t2v_v1
  default_profile_keys_by_input_pattern:
    prompt_only: seedance_2_0_t2v_v1
    single_image: seedance_2_0_first_frame_v1
    first_last_frames: seedance_2_0_first_last_frame_v1
    multimodal_reference: seedance_2_0_multimodal_reference_v1
defaults: {}
transport:
  endpoint_family: market
  create_path: /api/v1/jobs/createTask
  status_path: /api/v1/jobs/recordInfo
  callback_supported: true
verification:
  verified_from:
    - live_page_api_surface
    - docs_kie_secondary
  verified_on: '2026-04-04'
  verification_notes:
    - Verified against the live https://kie.ai/seedance-2-0 playground field list and the https://docs.kie.ai/market/bytedance/seedance-2 API page on 2026-04-04.
    - The live page exposes prompt, first_frame_url, last_frame_url, reference_image_urls, reference_video_urls, reference_audio_urls, return_last_frame, generate_audio, resolution, aspect_ratio, duration, and web_search.
    - The live page shows image uploads supporting JPG, PNG, WEBP, BMP, and GIF up to 30MB each.
    - The live UI states the total length of reference videos must not exceed 15 seconds and allows up to 3 reference videos.
    - The prompt box examples reference uploaded assets with @imageN style tokens, so the SDK renders reference guidance metadata for wrapper prompts.
    - The docs do not clearly publish authoritative pricing for Seedance 2.0 at this time, so pricing remains unknown until live verification.
    - The docs and live page both present Seedance as one endpoint that supports text-only, first-frame, first+last-frame, and multimodal reference scenarios.
  field_provenance:
    key: inferred
    label: inferred
    family: inferred
    provider_model: verified_docs
    task_modes: inferred
    inputs.image.required_min: inferred
    inputs.image.required_max: verified_live
    inputs.video.required_min: inferred
    inputs.video.required_max: verified_live
    inputs.audio.required_min: inferred
    inputs.audio.required_max: verified_live
    input_constraints.image_formats: verified_live
    input_constraints.image_max_mb: verified_live
    input_constraints.video_duration_max_seconds: verified_live
    options.return_last_frame.type: inferred
    options.return_last_frame.default: inferred
    options.generate_audio.type: inferred
    options.generate_audio.default: inferred
    options.resolution.type: inferred
    options.resolution.allowed: verified_live
    options.resolution.default: inferred
    options.aspect_ratio.type: inferred
    options.aspect_ratio.allowed: verified_live
    options.aspect_ratio.default: inferred
    options.duration.type: inferred
    options.duration.min: verified_docs
    options.duration.max: verified_live
    options.duration.required: inferred
    options.web_search.type: inferred
    options.web_search.default: inferred
    prompt.required: verified_live
    prompt.max_chars: unknown
    prompt.enhancement_supported: inferred
    prompt.enhancement_default_policy: inferred
    prompt.default_profile_key: inferred
    prompt.default_profile_keys_by_input_pattern: inferred
    defaults: inferred
    transport.endpoint_family: inferred
