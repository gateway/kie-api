key: seedance-2.0
label: Seedance 2.0 Standard
family: market
provider_model: bytedance/seedance-2
task_modes:
  - text_to_video
  - reference_to_video
inputs:
  image:
    required_min: 0
    required_max: 9
  video:
    required_min: 0
    required_max: 3
  audio:
    required_min: 0
    required_max: 3
input_constraints:
  image_formats: [jpg, jpeg, png, webp, bmp, tiff, gif]
  image_max_mb: 30
  image_min_dimension_px: 300
  image_max_dimension_px: 6000
  image_aspect_ratio_min: 0.4
  image_aspect_ratio_max: 2.5
  video_formats: [mp4, mov]
  video_max_mb: 50
  video_duration_min_seconds: 2
  video_duration_max_seconds: 15
  video_total_duration_max_seconds: 15
  video_min_dimension_px: 300
  video_max_dimension_px: 6000
  video_aspect_ratio_min: 0.4
  video_aspect_ratio_max: 2.5
  video_total_pixels_min: 409600
  video_total_pixels_max: 927408
  video_fps_min: 24
  video_fps_max: 60
  audio_formats: [wav, mp3]
  audio_max_mb: 15
  audio_duration_min_seconds: 2
  audio_duration_max_seconds: 15
  audio_total_duration_max_seconds: 15
options:
  return_last_frame:
    type: bool
    default: false
  generate_audio:
    type: bool
    default: false
  resolution:
    type: enum
    allowed: [480p, 720p, 1080p, 4k]
    default: 720p
  aspect_ratio:
    type: enum
    allowed: ['16:9', '4:3', '1:1', '3:4', '9:16', '21:9', adaptive]
    default: '16:9'
  duration:
    type: int_range
    min: 4
    max: 15
    required: true
    label: Duration
    help_text: "Video length in seconds. Seedance 2.0 supports 4s through 15s generations."
    ui_group: generation
    ui_order: 10
  web_search:
    type: bool
    default: false
prompt:
  required: true
  min_chars: 3
  max_chars: 20000
  enhancement_supported: true
  enhancement_default_policy: ask
  default_profile_key: seedance_2_0_t2v_v1
  default_profile_keys_by_input_pattern:
    prompt_only: seedance_2_0_t2v_v1
    single_image: seedance_2_0_first_frame_v1
    first_last_frames: seedance_2_0_first_last_frame_v1
    multimodal_reference: seedance_2_0_multimodal_reference_v1
defaults: {}
transport:
  endpoint_family: market
  create_path: /api/v1/jobs/createTask
  status_path: /api/v1/jobs/recordInfo
  callback_supported: true
verification:
  verified_from:
    - live_page_api_surface
    - docs_kie_secondary
    - site_pricing_api
  verified_on: '2026-07-06'
  verification_notes:
    - Verified against the live https://kie.ai/seedance-2-0 playground field list and the https://docs.kie.ai/market/bytedance/seedance-2 API page on 2026-04-04.
    - The live page exposes prompt, first_frame_url, last_frame_url, reference_image_urls, reference_video_urls, reference_audio_urls, return_last_frame, generate_audio, resolution, aspect_ratio, duration, and web_search.
    - The 2026-04-29 docs page example still shows 720p, but the KIE public pricing API now publishes 1080p rows for bytedance/seedance-2 with and without video input, so the SDK exposes 1080p as a supported resolution tier.
    - The live page and KIE public pricing API expose 4k as a Seedance 2.0 Standard resolution tier as of 2026-07-06.
    - The 2026-07-06 docs schema sets prompt length to min 3 and max 20000 characters.
    - The 2026-07-06 docs schema lists reference images as jpeg, png, webp, bmp, tiff, or gif, with aspect ratio 0.4 through 2.5, each side 300 through 6000 px, and max 30 MB.
    - The 2026-07-06 docs schema lists reference videos as mp4 or mov, 480p/720p source resolution, 2s through 15s each, max 3 videos, total duration <= 15s, aspect ratio 0.4 through 2.5, each side 300 through 6000 px, total pixels 409600 through 927408, max 50 MB, and 24 through 60 FPS.
    - The 2026-07-06 docs schema lists reference audio as wav or mp3, 2s through 15s each, max 3 audios, total duration <= 15s, and max 15 MB.
    - The docs schema exposes generate_audio with default true, but the SDK keeps the option default false to avoid surprise cost increases.
    - The docs schema exposes nsfw_checker, but this SDK intentionally leaves it unavailable so unknown safety-checker passthrough must be explicit.
    - The live page shows image uploads supporting JPG, PNG, WEBP, BMP, and GIF up to 30MB each; the docs schema additionally lists TIFF.
    - The live UI states the total length of reference videos must not exceed 15 seconds and allows up to 3 reference videos.
    - The prompt box examples reference uploaded assets with @imageN style tokens, so the SDK renders reference guidance metadata for wrapper prompts.
    - The public pricing API publishes non-authoritative observed pricing rows for Seedance 2.0, including 1080p tiers.
    - The docs and live page both present Seedance as one endpoint that supports text-only, first-frame, first+last-frame, and multimodal reference scenarios.
    - The 2026-06-01 docs schema exposes adaptive as an aspect_ratio option for Seedance 2.0.
