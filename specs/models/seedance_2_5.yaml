key: seedance-2.5
label: Seedance 2.5
family: market
provider_model: bytedance/seedance-2-5
task_modes:
  - text_to_video
  - reference_to_video
inputs:
  image:
    required_min: 0
    required_max: 30
  video:
    required_min: 0
    required_max: 10
  audio:
    required_min: 0
    required_max: 10
input_constraints:
  image_formats: [jpg, jpeg, png, webp, bmp, tiff, gif]
  image_max_mb: 30
  image_min_dimension_px: 300
  image_max_dimension_px: 6000
  image_aspect_ratio_min: 0.4
  image_aspect_ratio_max: 2.5
  video_formats: [mp4, mov]
  video_max_mb: 200
  video_duration_min_seconds: 2
  video_duration_max_seconds: 30
  video_total_duration_max_seconds: 30
  video_min_dimension_px: 300
  video_max_dimension_px: 6000
  video_aspect_ratio_min: 0.4
  video_aspect_ratio_max: 2.5
  video_total_pixels_min: 409600
  video_total_pixels_max: 927408
  video_fps_min: 24
  video_fps_max: 60
  audio_formats: [wav, mp3]
  audio_max_mb: 15
  audio_duration_min_seconds: 2
  audio_duration_max_seconds: 30
  audio_total_duration_max_seconds: 30
options:
  return_last_frame:
    type: bool
    default: false
  generate_audio:
    type: bool
    default: false
  resolution:
    type: enum
    allowed: [480p, 720p, 1080p]
    default: 720p
  aspect_ratio:
    type: enum
    allowed: ['1:1', '4:3', '3:4', '16:9', '9:16', '21:9', adaptive]
    default: adaptive
  duration:
    type: int_range
    allowed: [-1]
    min: 4
    max: 30
    required: true
    label: Duration
    help_text: "Video length in seconds. Choose 4 through 30, or -1 for provider-selected automatic duration."
    ui_group: generation
    ui_order: 10
  output_format:
    type: enum
    allowed: [mp4, mov]
    default: mp4
  web_search:
    type: bool
    default: false
  nsfw_checker:
    type: bool
    default: false
    label: NSFW checker
    help_text: "Keep off to match the Studio policy for this model."
    ui_group: generation
    ui_order: 90
    advanced: true
prompt:
  required: true
  max_chars: 30000
  enhancement_supported: true
  enhancement_default_policy: ask
  default_profile_key: seedance_2_0_t2v_v1
  default_profile_keys_by_input_pattern:
    prompt_only: seedance_2_0_t2v_v1
    single_image: seedance_2_0_first_frame_v1
    first_last_frames: seedance_2_0_first_last_frame_v1
    multimodal_reference: seedance_2_0_multimodal_reference_v1
defaults: {}
transport:
  endpoint_family: market
  create_path: /api/v1/jobs/createTask
  status_path: /api/v1/jobs/recordInfo
  callback_supported: true
verification:
  verified_from:
    - live_page_api_surface
    - docs_kie_secondary
    - site_pricing_api
    - official_kie_telegram_announcement
  verified_on: '2026-08-17'
  verification_notes:
    - Initially verified against the live https://kie.ai/seedance-2-5 model page and https://docs.kie.ai/market/bytedance/seedance-2-5.md OpenAPI schema on 2026-08-12; the resolution enum and pricing were reverified on 2026-08-17.
    - The provider model is bytedance/seedance-2-5 and uses the existing Market createTask and recordInfo endpoints.
    - Text-only, first-frame, first+last-frame, and multimodal-reference requests share one endpoint; first/last-frame guidance is mutually exclusive with multimodal references.
    - The API exposes at most 30 reference images, 10 reference videos, and 10 reference audios; reference videos and audios each have a 30-second combined-duration limit.
    - The API accepts KIE URLs and provider asset://{assetId} references for frame and multimodal media fields.
    - The 2026-08-17 OpenAPI schema explicitly exposes 480p, 720p, and 1080p output; its nearby prose still mentions only 480p and 720p, so the machine-readable enum is treated as authoritative.
    - KIE's official Telegram announcement supplied on 2026-08-17 states that 1080p output supports 10-bit color depth and higher-fidelity detail, lighting, and skin tones.
    - Duration accepts explicit integer values from 4 through 30 plus -1 for provider-selected automatic duration.
    - The schema references draft behavior in return_last_frame help text but does not define a draft request field, so the SDK does not invent one.
    - The docs default generate_audio to true, but the SDK keeps it false to avoid surprise cost increases.
    - The Studio policy requires nsfw_checker to remain off; the option is supported and submitted with default false.
    - Status callbacks may return resultUrls, firstFrameUrl, lastFrameUrl, or resultObject inside resultJson.
    - Public pricing rows are observed rather than provider-authoritative and vary by resolution and the presence of reference_video_urls.
    - The public pricing API exposes promotional 1080p rates of 68.5 credits/s with video input and 114 credits/s without video input; KIE announced a 28% discount through 2026-09-17 06:00 UTC, so pricing must be refreshed after that deadline.
